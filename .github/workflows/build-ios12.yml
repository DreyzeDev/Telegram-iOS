name: Build Telegram 11.12 for iOS 12

# Unsigned Telegram build at the last source revision that still targets iOS 12
# (Telegram 11.12, commit 99e09e0d). Mirrors Telegram's own build.yml, but runs on
# an Apple Silicon runner (the pinned Bazel SHA256 is the darwin-arm64 binary) and
# uploads the IPA as a workflow artifact instead of creating a release.

on:
  push:
    branches: [ios12-11.12]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode
        run: |
          set -x
          WANTED=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          ls -d /Applications/Xcode*.app || true
          if [ -d "/Applications/Xcode_${WANTED}.app" ]; then
            XCODE="/Applications/Xcode_${WANTED}.app"
          else
            # Fall back to the newest installed Xcode 16.x (still supports an iOS 12 deployment target).
            XCODE=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
            echo "OVERRIDE_XCODE=--overrideXcodeVersion" >> "$GITHUB_ENV"
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Free disk space
        run: |
          df -h /
          CURRENT=$(xcode-select -p | sed 's#/Contents/Developer##')
          for app in /Applications/Xcode_*.app; do
            [ "$app" = "$CURRENT" ] || sudo rm -rf "$app"
          done
          sudo rm -rf ~/Library/Android /usr/local/share/dotnet /usr/local/lib/node_modules || true
          df -h /

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R "$GITHUB_WORKSPACE" /Users/Shared/
          mv "/Users/Shared/$(basename "$GITHUB_WORKSPACE")" /Users/Shared/telegram-ios

      - name: Build the app
        run: |
          set -x
          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"
          cd "$SOURCE_DIR"

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          export APP_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["app"])')
          export BUILD_NUMBER="$(( $(git rev-list --count HEAD) + BUILD_NUMBER_OFFSET ))"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            ${OVERRIDE_XCODE:-} \
            --bazelArguments="--local_resources=memory=HOST_RAM*.75" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          mkdir -p build/artifacts
          for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/Telegram.ipa; do
            cp "$f" build/artifacts/
          done
          ls -lh build/artifacts
          df -h /

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}-ipa
          path: /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa
          retention-days: 14
          if-no-files-found: error
