name: Build Telegram 11.12 for iOS 12

# Unsigned Telegram build at the last source revision that still targets iOS 12
# (Telegram 11.12, commit 99e09e0d). Mirrors Telegram's own build.yml, but runs on
# an Apple Silicon runner (the pinned Bazel SHA256 is the darwin-arm64 binary) and
# uploads the IPA as a workflow artifact instead of creating a release.

on:
  push:
    branches: [ios12-11.12]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      # tgcalls and rlottie use relative submodule URLs (../tgcalls.git), which resolve to
      # this fork; point them back at the upstream TelegramMessenger repositories.
      - name: Fetch submodules
        run: |
          set -x
          git config --global url."https://github.com/TelegramMessenger/".insteadOf "https://github.com/${GITHUB_REPOSITORY_OWNER}/"
          git submodule sync --recursive
          git submodule update --init --recursive --jobs 8
          git submodule status | head -20

      - name: Select Xcode
        run: |
          set -x
          WANTED=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          ls -d /Applications/Xcode*.app || true
          if [ -d "/Applications/Xcode_${WANTED}.app" ]; then
            XCODE="/Applications/Xcode_${WANTED}.app"
          else
            # Fall back to the newest installed Xcode 16.x (still supports an iOS 12 deployment target).
            XCODE=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
            echo "OVERRIDE_XCODE=--overrideXcodeVersion" >> "$GITHUB_ENV"
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          # Some third-party build scripts (dav1d) hardcode /Applications/Xcode.app.
          sudo rm -rf /Applications/Xcode.app
          sudo ln -s "$XCODE" /Applications/Xcode.app
          ls -la /Applications/Xcode.app
          xcodebuild -version

      # ibtool (LaunchScreen.xib) needs the iOS platform runtime that matches the selected Xcode SDK.
      - name: Install iOS platform for Xcode
        run: |
          set -x
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          xcrun simctl runtime list || true
          if ! xcrun simctl runtime list 2>/dev/null | grep -q "iOS ${SDK_VERSION}"; then
            sudo xcodebuild -downloadPlatform iOS -buildVersion "${SDK_VERSION}" || xcodebuild -downloadPlatform iOS
          fi
          xcrun simctl runtime list || true
          df -h /

      - name: Free disk space
        run: |
          df -h /
          CURRENT=$(xcode-select -p | sed 's#/Contents/Developer##')
          for app in /Applications/Xcode_*.app; do
            [ "$app" = "$CURRENT" ] || sudo rm -rf "$app"
          done
          sudo rm -rf ~/Library/Android /usr/local/share/dotnet /usr/local/lib/node_modules || true
          df -h /

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R "$GITHUB_WORKSPACE" /Users/Shared/
          mv "/Users/Shared/$(basename "$GITHUB_WORKSPACE")" /Users/Shared/telegram-ios

      - name: Build the app
        run: |
          set -x
          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"
          cd "$SOURCE_DIR"

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          export APP_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["app"])')
          export BUILD_NUMBER="$(( $(git rev-list --count HEAD) + BUILD_NUMBER_OFFSET ))"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

          # At this revision BroadcastUpload.mobileprovision sits next to profiles/ instead of inside it,
          # so the build_configuration repo lacks the target the Telegram BUILD file references.
          if [ ! -f build-system/fake-codesigning/profiles/BroadcastUpload.mobileprovision ]; then
            cp build-system/fake-codesigning/BroadcastUpload.mobileprovision build-system/fake-codesigning/profiles/
          fi

          # The fake-codesigning profiles shipped at this revision expired on 2025-10-29. The IPA is
          # re-signed for jailbroken devices afterwards, so skip rules_apple's expiration check.
          PLISTTOOL=build-system/bazel-rules/rules_apple/tools/plisttool/plisttool.py
          sed -i '' 's/    if expire and expire < datetime.datetime.now():/    if False and expire:/' "$PLISTTOOL"
          grep -n "if False and expire" "$PLISTTOOL"

          # The fake signing certificate expired too, so the keychain has no matching identity.
          # Sign ad hoc instead (rules_apple skips the identity lookup for "-"); the IPA is
          # re-signed with ldid for jailbroken devices anyway. Make.py at this revision ignores
          # --bazelArguments, so the flag goes into the workspace .bazelrc.
          echo 'build --ios_signing_cert_name=-' >> .bazelrc
          tail -2 .bazelrc

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            ${OVERRIDE_XCODE:-} \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          # Bazel 8 names the output directory differently from Telegram's old CI glob
          # (e.g. ios_arm64-opt-ios-arm64-min12.0-applebin_ios-ST-<hash>), so search for it.
          mkdir -p build/artifacts
          IPA=$(find -L bazel-out/ -maxdepth 6 -path '*/bin/Telegram/Telegram.ipa' -type f | head -1)
          echo "IPA=$IPA"
          test -n "$IPA"
          cp "$IPA" build/artifacts/Telegram.ipa
          ls -lh build/artifacts
          df -h /

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}-ipa
          path: /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa
          retention-days: 14
          if-no-files-found: error
